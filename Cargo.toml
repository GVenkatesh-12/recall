[package]
name = "recall"
version = "0.1.0"
edition = "2024"
authors = ["Gopinath Venkatesh <gvenkatesh@example.com>"]
description = "A lightweight CLI note capture and clipboard utility."
license = "MIT"
readme = "README.md"
repository = "https://github.com/gvenkatesh/recall"
keywords = ["note", "capture", "clipboard", "sqlite", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3.4"
dirs = "5.0"
colored = "2.1"
anyhow = "1.0"
inquire = "0.7"

